# Optional full stack. Native Windows startup is the locally verified path.
services:
  api:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://fintech_demo:fintech_demo_local_only@db:5432/insurance_payment_demo
      FRONTEND_ORIGIN: http://localhost:3000
      PROVIDER_WORKER_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 8s
      retries: 12
  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
      args:
        API_PROXY_TARGET: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
