services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fintech_demo
      POSTGRES_PASSWORD: fintech_demo_local_only
      POSTGRES_DB: insurance_payment_demo
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - demo_pgdata:/var/lib/postgresql/data
      - ./database/init_test.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech_demo -d insurance_payment_demo"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  demo_pgdata:
