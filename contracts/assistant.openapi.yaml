openapi: 3.1.0
info:
  title: Demo optional Gemini chatbot API
  version: 1.0.0
  description: Authenticated, owner-scoped read-only chat. Cookie mutations require
    the existing X-CSRF-Token and origin checks. Gemini mode shares bounded context
    with Google; no tools or financial writes.
paths:
  /api/v1/finance/assistant/status:
    get:
      tags:
      - Student finance and bounded guidance
      summary: Assistant Status
      operationId: assistant_status_api_v1_finance_assistant_status_get
      security:
      - HTTPBearer: []
      - APIKeyCookie: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Csrf-Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/finance/assistant:
    post:
      tags:
      - Student finance and bounded guidance
      summary: Assistant
      operationId: assistant_api_v1_finance_assistant_post
      security:
      - HTTPBearer: []
      - APIKeyCookie: []
      parameters:
      - name: X-CSRF-Token
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Csrf-Token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantInput'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantReply'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '429':
          description: Persistent application request limit reached; no generation
            is performed.
      description: Defaults to direct lookup. use_gemini=true requests optional generation.
        history is bounded and untrusted. Provider errors return method GROUNDED_WORKFLOW
        with provider RULES and fallback_reason; never label a fallback as Gemini.
        Response citations/actions are server-owned; executed_actions is always empty.
        Rate limiting can return HTTP 429.
components:
  schemas:
    AssistantInput:
      properties:
        message:
          type: string
          maxLength: 500
          minLength: 2
          title: Message
        use_gemini:
          type: boolean
          title: Use Gemini
          default: false
        language:
          type: string
          enum:
          - vi
          - en
          - zh
          title: Language
          default: vi
        history:
          items:
            $ref: '#/components/schemas/ChatTurn'
          type: array
          maxItems: 6
          title: History
      additionalProperties: false
      type: object
      required:
      - message
      title: AssistantInput
    ChatTurn:
      properties:
        role:
          type: string
          enum:
          - user
          - assistant
          title: Role
        content:
          type: string
          maxLength: 4000
          minLength: 1
          title: Content
      additionalProperties: false
      type: object
      required:
      - role
      - content
      title: ChatTurn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    AssistantReply:
      type: object
      required:
      - method
      - answer
      - citations
      - actions
      - executed_actions
      - notice
      properties:
        method:
          type: string
          enum:
          - GROUNDED_WORKFLOW
          - GEMINI_GROUNDED
        provider:
          type: string
          enum:
          - RULES
          - GEMINI
        model:
          type: string
        answer:
          type: string
        intent:
          type: string
        fallback_reason:
          type: string
        notice:
          type: string
        executed_actions:
          type: array
          maxItems: 0
          items:
            type: string
        actions:
          type: array
          items:
            type: object
            required:
            - title
            - href
            properties:
              title:
                type: string
              href:
                type: string
        citations:
          type: array
          items:
            type: object
            description: 'Server-owned source: title plus href/url, or document_id/filename/page/excerpt;
              optional source_id.'
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
    APIKeyCookie:
      type: apiKey
      in: cookie
      name: baoan_session
